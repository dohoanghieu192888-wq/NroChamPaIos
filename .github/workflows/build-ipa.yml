name: NroChamPa iOS Build

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build unsigned IPA
runs-on: macos-14
timeout-minutes: 120

steps:
  - name: Checkout source
    uses: actions/checkout@v4
    with:
      lfs: true

  - name: Check project files
    run: |
      set -e
      echo "Checking Xcode project..."
      ls -la
      test -d Unity-iPhone.xcodeproj
      test -f scripts/build-ipa.sh

  - name: Select Xcode
    run: |
      set -e
      xcodebuild -version

  - name: Build unsigned IPA
    env:
      APP_NAME: NroChamPa
      IPA_NAME: NroChamPa.ipa
      PROJECT: Unity-iPhone.xcodeproj
      SCHEME: Unity-iPhone
      CONFIG: Release
      OUT_DIR: build
    run: bash scripts/build-ipa.sh

  - name: Verify IPA
    run: |
      set -e
      test -s build/NroChamPa.ipa
      unzip -t build/NroChamPa.ipa

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: NroChamPa-unsigned-IPA
      path: build/NroChamPa.ipa
      if-no-files-found: error
      retention-days: 30
