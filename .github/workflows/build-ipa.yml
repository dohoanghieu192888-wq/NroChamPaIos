name: Build unsigned IPA

# Build file .ipa khong ky tren macOS runner cua GitHub (mien phi voi repo public).
# Sau khi chay xong, tai file .ipa trong tab Actions -> chon run -> Artifacts.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Xcode 15.4: ho tro deployment target iOS 12.0 cua project nay.
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Verify IPA
        run: |
          set -euo pipefail
          ls -lh build/*.ipa
          unzip -l build/*.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NroChamPa-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30
